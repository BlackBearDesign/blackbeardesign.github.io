<script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxLnTKKWyN8pLJt5uMXjnritxPazqsAp32q1IbqdH8XfSBnpIIcC2Y2teJRJJdWrypCzQ/exec";
    
    let orderId = new URLSearchParams(window.location.search).get('id');

    document.addEventListener('DOMContentLoaded', () => {
        if(!orderId) {
            document.getElementById('loading-view').innerHTML = "<h1 style='color:red'>ORDER ID REQUIRED IN URL</h1>";
            return;
        }

        fetch(SCRIPT_URL + "?id=" + orderId + "&t=" + Date.now())
            .then(response => response.json())
            .then(data => {
                if(data.error) {
                    document.getElementById('loading-view').innerHTML = "<h1>ORDER #" + orderId + " NOT FOUND</h1>";
                } else {
                    render(data);
                }
            })
            .catch(err => {
                console.error(err);
                document.getElementById('loading-view').innerHTML = "<h1 style='color:red'>SERVER CONNECTION ERROR</h1>";
            });
    });

    function render(o) {
        document.getElementById('loading-view').style.display = 'none';
        document.getElementById('order-view').style.display = 'block';

        const categoria = (o.Categoria_Pago || "").toString();
        const estatus = (o.Estatus || "AWAITING_PAYMENT").toString();
        
        // Mostrar datos
        document.getElementById('order-main-title').innerText = "ORDER FOR " + (o.Cliente || "CLIENT");
        document.getElementById('order-description').innerText = (o.Descripción || o.Descripcion || "No description available.");
        document.getElementById('order-revisions').innerText = o.Revisiones || "0";
        document.getElementById('order-price').innerText = o.Precio_Total || "$0.00";
        
        // Convertir estado técnico a texto legible para mostrar
        let statusDisplay = estatus.replace(/_/g, ' ');
        if(estatus === "AWAITING_PAYMENT") statusDisplay = "AWAITING PAYMENT";
        if(estatus === "IN_PRODUCTION") statusDisplay = "IN PRODUCTION";
        if(estatus === "REVIEW") statusDisplay = "UNDER REVIEW";
        if(estatus === "COMPLETED") statusDisplay = "COMPLETED";
        
        document.getElementById('order-status-text').innerText = statusDisplay;
        document.getElementById('order-category').innerText = categoria || "PAYMENT";

        renderContract(categoria);

        // Lógica de estados en INGLÉS
        if(estatus === 'REVIEW' && o.Link_YouTube) {
            document.getElementById('preview-box').style.display = 'block';
            let videoUrl = o.Link_YouTube.toString();
            videoUrl = videoUrl.replace('watch?v=', 'embed/');
            videoUrl = videoUrl.replace('youtu.be/', 'youtube.com/embed/');
            if(!videoUrl.includes('embed')) {
                videoUrl = videoUrl.replace('youtube.com/', 'youtube.com/embed/');
            }
            document.getElementById('video-iframe').innerHTML = 
                `<iframe src="${videoUrl}?modestbranding=1&rel=0&controls=1" 
                 style="position:absolute;top:0;left:0;width:100%;height:100%;" 
                 frameborder="0" allowfullscreen></iframe>`;
        } 
        else if(estatus === 'COMPLETED' && o.Link_Drive) {
            document.getElementById('actions-area').innerHTML = 
                `<a href="${o.Link_Drive}" target="_blank" class="btn-blackbear d-block text-center" 
                 style="text-decoration:none; padding: 20px; font-size: 14px;">
                 DOWNLOAD MASTER 4K<br>
                 <span style="font-size: 10px; opacity: 0.7; font-weight: 400; color: #fff;">Click to get your final file</span>
                 </a>`;
        }

        checkIfAlreadyUploaded(o);
    }

    function renderContract(categoria) {
        const contractBox = document.getElementById('contract-content');
        const cat = categoria.toString().toUpperCase().trim();
        
        let html = '';
        
        if (cat.includes('PREMIERE')) {
            html = `<strong>PREMIERE PASS AGREEMENT:</strong><br>
                    <span style="color: #fff;">100% Upfront Payment</span><br>
                    Pay in full to start production and receive your final product with no remaining balance.<br><br>
                    1. Full payment validates immediate project start.<br>
                    2. Master file delivered watermark-free with no outstanding balance.<br>
                    3. Client is entitled to revisions as specified in the order.<br>
                    4. BlackBear retains portfolio rights unless NDA agreement is signed.`;
        } else if (cat.includes('DIRECTOR') || cat.includes('DIRECTORS')) {
            html = `<strong>DIRECTOR'S CUT AGREEMENT:</strong><br>
                    <span style="color: #fff;">50/50 Payment Split</span><br>
                    50% deposit to begin; remaining 50% balance to unlock the Master file (no watermarks).<br><br>
                    1. 50% deposit validates project start and is non-refundable.<br>
                    2. Final Master file delivered upon payment of remaining 50% balance.<br>
                    3. Client is entitled to revisions as specified in the order.<br>
                    4. BlackBear retains portfolio rights unless NDA agreement is signed.`;
        } else if (cat.includes('LEGACY')) {
            html = `<strong>LEGACY STATUS AGREEMENT:</strong><br>
                    <span style="color: #fff;">VIP Priority Access</span><br>
                    Exclusive terms and priority delivery reserved for returning and high-volume clients.<br><br>
                    1. Exclusive terms and guaranteed priority delivery.<br>
                    2. Payment flexibility: submit proof of payment in parts or at a later date.<br>
                    3. Direct access to production team and priority support.<br>
                    4. BlackBear retains portfolio rights unless NDA agreement is signed.`;
        } else {
            html = `<strong>STANDARD SERVICE AGREEMENT:</strong><br>
                    1. Deposit validates project start and is non-refundable.<br>
                    2. Final Master file delivered upon full payment of outstanding balance.<br>
                    3. Client is entitled to revisions as specified in the order.<br>
                    4. BlackBear retains portfolio rights unless NDA agreement is signed.`;
        }
        
        contractBox.innerHTML = html;
    }

    function checkIfAlreadyUploaded(o) {
        const comprobante1 = o.Comprobante_1 || "";
        const comprobante2 = o.Comprobante_2 || "";
        const categoria = (o.Categoria_Pago || "").toString().toUpperCase();
        
        // LEGACY STATUS: Always allow uploading (multiple payments allowed)
        if (categoria.includes('LEGACY')) {
            const label = document.getElementById('upload-label');
            if ((comprobante1.startsWith('http') && comprobante1 !== '[Imagen]') || 
                (comprobante2.startsWith('http') && comprobante2 !== '[Imagen]')) {
                label.innerText = "Upload additional proof (LEGACY - VIP)";
                label.style.color = "#4CAF50";
            }
            return;
        }
        
        // For others: block if already uploaded
        if ((comprobante1.startsWith('http') && comprobante1 !== '[Imagen]') || 
            (comprobante2.startsWith('http') && comprobante2 !== '[Imagen]')) {
            
            const uploadBox = document.querySelector('.upload-box-dotted');
            const fileInput = document.getElementById('fileInput');
            const btn = document.getElementById('upload-btn');
            const label = document.getElementById('upload-label');
            const check = document.getElementById('accept-check');
            
            uploadBox.style.borderColor = "#333";
            uploadBox.style.cursor = "default";
            uploadBox.onclick = null;
            label.innerText = "✓ PAYMENT PROOF RECEIVED";
            label.style.color = "#4CAF50";
            label.style.opacity = "1";
            
            fileInput.style.display = 'none';
            check.parentElement.style.display = 'none';
            
            btn.innerText = "IN REVIEW QUEUE";
            btn.className = "btn-blackbear btn-sent";
            btn.disabled = true;
            btn.onclick = null;
        }
    }

    function handleFileSelected() {
        const file = document.getElementById('fileInput').files[0];
        if(file) {
            if(file.size > 5 * 1024 * 1024) {
                alert("File too large. Maximum 5MB.");
                document.getElementById('fileInput').value = '';
                return;
            }
            document.getElementById('upload-label').innerText = "FILE: " + file.name;
            document.getElementById('upload-label').style.opacity = "1";
            document.getElementById('upload-label').style.color = "#fff";
        }
    }

    async function submitFile() {
        const check = document.getElementById('accept-check');
        const fileInput = document.getElementById('fileInput');
        const file = fileInput.files[0];

        if(!check.checked) return alert("You must accept the terms and conditions.");
        if(!file) return alert("Please select your payment proof first.");

        const btn = document.getElementById('upload-btn');
        btn.innerText = "SENDING...";
        btn.disabled = true;

        const reader = new FileReader();
        reader.onload = async (e) => {
            const base64 = e.target.result.split(',')[1];
            const formData = new URLSearchParams();
            formData.append('fileBase64', base64);
            formData.append('mimeType', file.type);
            formData.append('fileName', `Order_${orderId}_payment`);
            formData.append('orderId', orderId);

            try {
                const response = await fetch(SCRIPT_URL, { 
                    method: 'POST', 
                    body: formData 
                });
                
                const result = await response.json();
                
                if(result.result === "success") {
                    document.getElementById('upload-label').innerText = "✓ PAYMENT PROOF SENT";
                    document.getElementById('upload-label').style.color = "#4CAF50";
                    btn.innerText = "IN REVIEW QUEUE";
                    btn.className = "btn-blackbear btn-sent";
                    btn.onclick = null;
                    
                    alert("Payment proof received! We will review it shortly.");
                } else {
                    throw new Error(result.message || "Unknown error");
                }
            } catch (err) {
                console.error(err);
                alert("Error sending: " + err.message);
                btn.innerText = "SUBMIT PAYMENT";
                btn.disabled = false;
            }
        };
        reader.readAsDataURL(file);
    }
</script>
