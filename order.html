<!doctype html>
<html lang="es">
<head>
    <title>Producción | Dreamset Studios</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link href="https://fonts.googleapis.com/css?family=Montserrat:400,700,900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/vendor/bootstrap.min.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* ... (Pega aquí los estilos CSS de arriba) ... */
        .info-panel { background: rgba(10,10,10,0.8); padding: 30px; border: 1px solid #1a1a1a; border-radius: 8px; backdrop-filter: blur(10px); }
        .badge-status { padding: 8px 15px; border-radius: 4px; font-weight: 800; font-size: 11px; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 15px; display: inline-block; }
        .PREMIERE-PASS { background: #fff; color: #000; }
        .contract-box { height: 120px; overflow-y: scroll; border: 1px solid #222; padding: 15px; background: rgba(0,0,0,0.5); font-size: 11px; color: #aaa; margin-bottom: 20px; text-align: left; }
    </style>
</head>
<body>

    <div class="video-bg-global">
        <video autoplay loop muted playsinline><source src="video/bg.mp4" type="video/mp4"></video>
    </div>

    <div class="container py-5 mt-5">
        <div id="loading-view" class="text-center"><h2>SINCRONIZANDO...</h2></div>

        <div id="order-view" style="display:none;">
            <div class="row align-items-center">
                <div class="col-lg-7">
                    <span id="order-category" class="badge-status"></span>
                    <h1 id="order-title" style="font-weight: 900; font-size: 4rem; text-transform: uppercase; line-height: 1;"></h1>
                    <p id="order-description" class="mt-4" style="font-size: 18px; opacity: 0.7;"></p>
                    <p id="order-client" class="mt-5" style="letter-spacing: 4px; opacity: 0.3; text-transform: uppercase; font-size: 11px;"></p>
                </div>

                <div class="col-lg-5">
                    <div class="info-panel">
                        <div class="mb-4">
                            <span style="font-size: 10px; text-transform: uppercase; letter-spacing: 2px; opacity: 0.5;">Estatus</span>
                            <h3 id="order-status-text" style="font-weight: 900; text-transform: uppercase; margin: 0;"></h3>
                        </div>
                        
                        <div id="actions-area"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <script>
        const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vR7MfUJrspnPSDFqmPX0oPA_PtDE7312RnzngMrCwpGfgjRSvXD6jmiiDFVhAlbOTwmFmOEixPzBZ_z/pub?output=csv";
        const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxo0txYdwsl7p5YdBn4obClxFRQz3MXfgS1l6bHimyBP_p8FxPiSBvOdC8i7unntojGQQ/exec";

        document.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            const id = params.get('id');
            Papa.parse(CSV_URL, {
                download: true, header: true,
                complete: (results) => {
                    const order = results.data.find(row => row.ID === id);
                    if(order) renderOrder(order);
                }
            });
        });

        function renderOrder(order) {
            document.getElementById('loading-view').style.display = 'none';
            document.getElementById('order-view').style.display = 'block';
            document.getElementById('order-title').innerText = order.Proyecto;
            document.getElementById('order-description').innerText = order.Descripcion;
            document.getElementById('order-status-text').innerText = order.Estatus.replace(/_/g, ' ');
            
            const actions = document.getElementById('actions-area');

            if(order.Estatus === 'ESPERANDO_PAGO') {
                actions.innerHTML = `
                    <div class="contract-box">
                        <p><strong>INSTRUCCIONES</strong>: Realiza tu pago por PayPal, Binance o transferencia y sube la captura aquí abajo.</p>
                    </div>
                    <div class="mb-3 text-left">
                        <input type="checkbox" id="accept" checked> <label for="accept" style="font-size: 10px; font-weight: 700;">ACEPTO LOS TÉRMINOS</label>
                    </div>
                    <div class="upload-area" id="upload-box">
                        <p id="upload-label" style="font-size: 11px; font-weight: 700; opacity: 0.5; margin-bottom: 25px; text-transform: uppercase;">Sube tu comprobante (PNG/JPG)</p>
                        <input type="file" id="fileInput" class="d-none" onchange="handleFileSelected('${order.ID}')">
                        <button class="btn-blackbear" id="upload-btn" onclick="document.getElementById('fileInput').click()">ENVIAR PAGO</button>
                    </div>
                    <div class="text-center mt-3">
                        <a href="index.html" style="font-size: 10px; color: #444; text-decoration: none; letter-spacing: 2px;">&larr; VOLVER AL PORTAFOLIO</a>
                    </div>`;
            }
        }

        async function handleFileSelected(orderId) {
            const btn = document.getElementById('upload-btn');
            const label = document.getElementById('upload-label');
            const fileInput = document.getElementById('fileInput');
            const file = fileInput.files[0];

            if(!file) return;

            // UI: Estado enviando
            btn.innerText = "ENVIANDO...";
            btn.disabled = true;

            const reader = new FileReader();
            reader.onload = async (e) => {
                const base64 = e.target.result.split(',')[1];
                const formData = new URLSearchParams();
                formData.append('fileBase64', base64);
                formData.append('mimeType', file.type);
                formData.append('fileName', `Orden_${orderId}_anticipo`);
                formData.append('orderId', orderId);
                formData.append('type', 'anticipo');

                try {
                    await fetch(APPS_SCRIPT_URL, { method: 'POST', mode: 'no-cors', body: formData });
                    
                    // UI: Estado Éxito (Solo queda el botón con texto nuevo y el botón de cancelar)
                    label.style.display = 'none';
                    btn.innerText = "COMPROBANTE ENVIADO";
                    btn.className = "btn-blackbear btn-sent";
                    btn.onclick = null;
                    
                    const box = document.getElementById('upload-box');
                    box.innerHTML += `<button class="btn-cancel" onclick="location.reload()">CANCELAR ENTREGA</button>`;
                } catch (err) {
                    alert("Error. Intenta de nuevo.");
                    location.reload();
                }
            };
            reader.readAsDataURL(file);
        }
    </script>
</body>
</html>
