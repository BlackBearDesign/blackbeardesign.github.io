<!doctype html>
<html lang="es">
<head>
    <title>Estado de Producción | Dreamset Studios</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    
    <link href="https://fonts.googleapis.com/css?family=Montserrat:400,700,900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/vendor/bootstrap.min.css">
    <link rel="stylesheet" href="css/style.css">
    
    <style>
        body { 
            background-color: #000; 
            color: #fff; 
            font-family: 'Montserrat', sans-serif !important; 
        }
        .order-container { padding: 100px 0; min-height: 100vh; }
        
        /* Estilos de Etiquetas de Pago */
        .badge-status { padding: 8px 15px; border-radius: 4px; font-weight: 800; font-size: 11px; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 15px; display: inline-block; }
        .PREMIERE-PASS { background: #fff; color: #000; }
        .DIRECTORS-CUT { background: #333; color: #fff; border: 1px solid #555; }
        .LEGACY-STATUS { background: #ffd700; color: #000; }
        
        /* Paneles y Secciones */
        .info-panel { background: #0a0a0a; padding: 30px; border: 1px solid #1a1a1a; border-radius: 8px; }
        .contract-box { height: 150px; overflow-y: scroll; border: 1px solid #222; padding: 15px; background: #080808; font-size: 12px; color: #aaa; margin-bottom: 20px; }
        
        /* Métodos de Pago */
        .payment-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 20px; }
        .pay-btn { padding: 10px; text-align: center; border-radius: 4px; font-weight: 900; font-size: 10px; text-decoration: none !important; transition: 0.3s; }
        .pay-paypal { background: #003087; color: #fff; }
        .pay-wise { background: #00b5ff; color: #fff; }
        .pay-binance { background: #F3BA2F; color: #000; }
        
        .bank-info { background: #111; padding: 15px; border: 1px solid #222; font-size: 11px; margin-bottom: 20px; text-align: left; }
        .copy-link { color: #fff; font-weight: 700; cursor: pointer; text-decoration: underline; font-size: 9px; margin-left: 5px; opacity: 0.5; }
        
        /* Área de Carga Mejorada */
        .upload-area { border: 2px dashed #333; padding: 30px; text-align: center; border-radius: 10px; margin-top: 20px; position: relative; }
        .upload-success { display: none; background: rgba(0,255,0,0.1); border: 1px solid #0f0; padding: 20px; border-radius: 10px; }
        
        .btn-blackbear { background: #fff; color: #000; font-weight: 900; padding: 15px 30px; text-transform: uppercase; border: none; letter-spacing: 2px; width: 100%; transition: 0.3s; }
        .btn-blackbear:hover { transform: scale(1.02); cursor: pointer; }
        
        .btn-retry { background: transparent; color: #666; font-size: 10px; border: 1px solid #333; padding: 5px 15px; margin-top: 15px; text-transform: uppercase; font-weight: 700; }

        .video-container { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; border-radius: 8px; border: 1px solid #333; }
        .video-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        
        .revision-badge { background: #fff; color: #000; padding: 2px 10px; font-weight: 900; border-radius: 3px; }
    </style>
</head>
<body>

    <div class="container order-container">
        <div id="loading-view" class="text-center">
            <h2 style="font-weight: 900;">SINCRONIZANDO CON EL ESTUDIO...</h2>
        </div>

        <div id="order-view" style="display:none;">
            <div class="row">
                <div class="col-lg-7">
                    <span id="order-category" class="badge-status"></span>
                    <h1 id="order-title" style="font-weight: 900; font-size: 3.5rem; text-transform: uppercase; line-height: 1; margin-bottom: 20px;"></h1>
                    
                    <div class="mb-4">
                        <h5 style="font-weight: 800; font-size: 10px; text-transform: uppercase; letter-spacing: 2px; opacity: 0.5;">Descripción del Proyecto</h5>
                        <p id="order-description" style="font-size: 16px; color: #ccc; line-height: 1.6;"></p>
                    </div>

                    <p id="order-client" style="letter-spacing: 3px; opacity: 0.4; text-transform: uppercase; font-weight: 700; font-size: 11px;"></p>
                    
                    <div id="video-preview-section" style="display:none;" class="mt-5">
                        <h5 class="mb-3" style="font-weight: 800; font-size: 10px; text-transform: uppercase; letter-spacing: 2px;">Vista Previa (Marca de Agua)</h5>
                        <div class="video-container" id="video-iframe"></div>
                    </div>
                </div>

                <div class="col-lg-4 offset-lg-1">
                    <div class="info-panel">
                        <div class="mb-4">
                            <span style="font-weight: 800; font-size: 10px; text-transform: uppercase; letter-spacing: 2px; opacity: 0.4;">Estatus Actual</span>
                            <h3 id="order-status-text" style="font-weight: 900; text-transform: uppercase;"></h3>
                        </div>

                        <div class="mb-4 py-3 border-top border-bottom" style="border-color: #222 !important;">
                            <span class="d-block mb-2" style="font-weight: 800; font-size: 10px; text-transform: uppercase; letter-spacing: 2px; opacity: 0.4;">Revisiones</span>
                            <h4 style="font-weight: 900; margin: 0;">DISPONIBLES: <span id="order-revisions" class="revision-badge">0</span></h4>
                        </div>
                        
                        <div class="mb-5">
                            <span style="font-weight: 800; font-size: 10px; text-transform: uppercase; letter-spacing: 2px; opacity: 0.4;">Inversión Total</span>
                            <h4 id="order-price" style="font-weight: 900;"></h4>
                        </div>

                        <div id="actions-area">
                            </div>
                    </div>
                    
                    <div class="text-right mt-4">
                        <a href="index.html" style="font-size: 10px; font-weight: 700; color: #444; text-transform: uppercase; letter-spacing: 2px; text-decoration: none;">&larr; Volver al Portafolio</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <script>
        const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vR7MfUJrspnPSDFqmPX0oPA_PtDE7312RnzngMrCwpGfgjRSvXD6jmiiDFVhAlbOTwmFmOEixPzBZ_z/pub?output=csv";
        const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxo0txYdwsl7p5YdBn4obClxFRQz3MXfgS1l6bHimyBP_p8FxPiSBvOdC8i7unntojGQQ/exec";

        document.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            const id = params.get('id');

            if(!id) {
                document.getElementById('loading-view').innerHTML = "<h1>SE REQUIERE ID DE ORDEN</h1>";
                return;
            }

            Papa.parse(CSV_URL, {
                download: true,
                header: true,
                complete: (results) => {
                    const order = results.data.find(row => row.ID === id);
                    if(order) renderOrder(order);
                    else document.getElementById('loading-view').innerHTML = "<h1>ORDEN #" + id + " NO ENCONTRADA</h1>";
                }
            });
        });

        function renderOrder(order) {
            document.getElementById('loading-view').style.display = 'none';
            document.getElementById('order-view').style.display = 'block';

            document.getElementById('order-title').innerText = order.Proyecto;
            document.getElementById('order-description').innerText = order.Descripcion || "Sin descripción adicional.";
            document.getElementById('order-revisions').innerText = order.Revisiones || "0";
            document.getElementById('order-client').innerText = `CLIENTE: ${order.Cliente}`;
            document.getElementById('order-price').innerText = order.Precio_Total;
            document.getElementById('order-status-text').innerText = order.Estatus.replace(/_/g, ' ');
            
            const cat = document.getElementById('order-category');
            cat.innerText = order.Categoria_Pago;
            cat.className = `badge-status ${order.Categoria_Pago.replace(/\s+/g, '-').replace(/’/g, '')}`;

            const actions = document.getElementById('actions-area');
            
            if(order.Estatus === 'ESPERANDO_PAGO') {
                actions.innerHTML = `
                    <div class="contract-box">
                        <p><strong>INSTRUCCIONES DE PAGO</strong></p>
                        <p>1. Selecciona tu método preferido de la lista.</p>
                        <p>2. Realiza el depósito correspondiente al anticipo.</p>
                        <p>3. Sube la captura de pantalla o ticket aquí abajo.</p>
                    </div>

                    <div class="payment-grid">
                        <a href="TU_LINK_PAYPAL" target="_blank" class="pay-btn pay-paypal">PAYPAL</a>
                        <a href="TU_LINK_WISE" target="_blank" class="pay-btn pay-wise">WISE</a>
                        <a href="TU_LINK_BINANCE" target="_blank" class="pay-btn pay-binance">BINANCE</a>
                    </div>

                    <div class="bank-info">
                        <p><strong>MÉXICO (CLABE):</strong> 0000 0000 0000 0000 <span class="copy-link" onclick="copyValue('0000000000000000')">COPIAR</span></p>
                        <p style="margin-top: 10px;"><strong>ESPAÑA (IBAN):</strong> ES00 0000 0000 0000 <span class="copy-link" onclick="copyValue('ES0000000000000000')">COPIAR</span></p>
                    </div>

                    <div id="upload-container">
                        <div class="mb-3">
                            <input type="checkbox" id="accept"> <label for="accept" style="font-size: 10px; font-weight: 700; text-transform: uppercase;">Acepto los términos y condiciones</label>
                        </div>
                        <div class="upload-area" id="drop-zone">
                            <p id="upload-text" style="font-size: 11px; font-weight: 700; opacity: 0.5;">SUBE TU COMPROBANTE (PNG/JPG)</p>
                            <input type="file" id="fileInput" class="d-none" onchange="handleUpload('${order.ID}', 'anticipo')">
                            <button class="btn-blackbear" id="main-upload-btn" onclick="document.getElementById('fileInput').click()">ENVIAR PAGO</button>
                        </div>
                        <div class="upload-success" id="success-msg">
                            <p style="font-weight: 900; color: #0f0; margin-bottom: 0;">¡COMPROBANTE ENVIADO!</p>
                            <p style="font-size: 10px; opacity: 0.6;">Validaremos tu pago en breve para iniciar la producción.</p>
                            <button class="btn-retry" onclick="resetUpload()">Cancelar y reintentar</button>
                        </div>
                    </div>`;
            } else if(order.Estatus === 'REVISION') {
                document.getElementById('video-preview-section').style.display = 'block';
                document.getElementById('video-iframe').innerHTML = `<iframe src="${order.Link_YouTube.replace('watch?v=', 'embed/')}?modestbranding=1&rel=0" frameborder="0" allowfullscreen></iframe>`;
                
                actions.innerHTML = `
                    <p class="small opacity-50 mb-3">Si el demo es correcto, liquida el saldo para liberar el Master en 4K.</p>
                    <input type="file" id="fileInputFinal" class="d-none" onchange="handleUpload('${order.ID}', 'final')">
                    <button class="btn-blackbear" onclick="document.getElementById('fileInputFinal').click()">LIQUIDAR Y FINALIZAR</button>`;
            } else if(order.Estatus === 'COMPLETADO') {
                actions.innerHTML = `
                    <a href="${order.Link_Drive}" target="_blank" class="btn-blackbear d-block text-center mb-4">DESCARGAR MASTER 4K</a>
                    <div class="mt-4 p-3 border border-dark text-center">
                        <p style="font-size: 11px; opacity: 0.5; margin: 0;">PROYECTO FINALIZADO CON ÉXITO</p>
                    </div>`;
            }
        }

        async function handleUpload(orderId, type) {
            const check = document.getElementById('accept');
            if(check && !check.checked) return alert("Debes aceptar los términos.");
            
            const fileInput = document.getElementById(type === 'anticipo' ? 'fileInput' : 'fileInputFinal');
            const file = fileInput.files[0];
            if(!file) return;

            // UI: Mostrando carga
            const btn = document.getElementById('main-upload-btn');
            if(btn) btn.innerText = "ENVIANDO...";

            const reader = new FileReader();
            reader.onload = async (e) => {
                const base64 = e.target.result.split(',')[1];
                const formData = new URLSearchParams();
                formData.append('fileBase64', base64);
                formData.append('mimeType', file.type);
                formData.append('fileName', `Orden_${orderId}_${type}`);
                formData.append('orderId', orderId);
                formData.append('type', type);

                try {
                    await fetch(APPS_SCRIPT_URL, { method: 'POST', mode: 'no-cors', body: formData });
                    
                    // Mostrar mensaje de éxito y ocultar área de carga
                    document.getElementById('drop-zone').style.display = 'none';
                    document.getElementById('success-msg').style.display = 'block';
                } catch (err) {
                    alert("Error en el envío. Intenta de nuevo.");
                    if(btn) btn.innerText = "ENVIAR PAGO";
                }
            };
            reader.readAsDataURL(file);
        }

        function resetUpload() {
            document.getElementById('drop-zone').style.display = 'block';
            document.getElementById('success-msg').style.display = 'none';
            document.getElementById('fileInput').value = "";
            document.getElementById('main-upload-btn').innerText = "ENVIAR PAGO";
        }

        function copyValue(val) {
            navigator.clipboard.writeText(val);
            alert("Copiado: " + val);
        }
    </script>
</body>
</html>
