<!doctype html>
<html lang="es">
<head>
    <title>Estado de Producción | BlackBear</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link rel="icon" type="image/png" href="images/icon.png">
    
    <link rel="stylesheet" href="css/vendor/icomoon/style.css">
    <link rel="stylesheet" href="css/vendor/owl.carousel.min.css">
    <link rel="stylesheet" href="css/vendor/aos.css">
    <link rel="stylesheet" href="css/vendor/bootstrap.min.css">
    <link rel="stylesheet" href="css/style.css">

    <style>
      /* Fondo de video fijo detrás de todo */
      .video-bg-global { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; background: #000; }
      .video-bg-global video { width: 100%; height: 100%; object-fit: cover; opacity: 0.5; }

      body, .unslate_co--site-wrap, .unslate_co--site-inner { background-color: transparent !important; color: #fff; }

      /* Ajustes para el contenedor de la orden */
      .order-section { padding-top: 150px; padding-bottom: 100px; min-height: 80vh; }
      .info-panel { background: rgba(10,10,10,0.85); padding: 40px; border: 1px solid #1a1a1a; border-radius: 8px; backdrop-filter: blur(15px); }
      
      /* Estilo del Botón y Carga */
      .upload-area { border: 2px dashed rgba(255,255,255,0.2); padding: 40px 20px; text-align: center; border-radius: 10px; margin-top: 25px; }
      .btn-blackbear { background: #fff; color: #000; font-weight: 800; padding: 18px 40px; text-transform: uppercase; border: none; letter-spacing: 3px; width: 100%; cursor: pointer; transition: 0.3s; }
      .btn-sent { background: #111; color: #fff; border: 1px solid #333; cursor: default; letter-spacing: 1px; }
      .btn-cancel { background: transparent; color: #666; font-size: 10px; border: none; text-decoration: underline; margin-top: 15px; cursor: pointer; text-transform: uppercase; font-weight: 700; display: block; width: 100%; }

      /* Etiquetas y texto */
      .badge-status { padding: 8px 15px; border-radius: 4px; font-weight: 800; font-size: 11px; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 15px; display: inline-block; background: #fff; color: #000; }
      .revision-badge { background: #fff; color: #000; padding: 2px 10px; font-weight: 900; border-radius: 3px; }
      
      /* Footer Estilo Index */
      .unslate_co--footer { background-color: #191919 !important; position: relative !important; z-index: 10 !important; }
    </style>
</head>
<body data-spy="scroll" data-target=".site-nav-target" data-offset="200">

    <div class="video-bg-global">
        <video autoplay loop muted playsinline><source src="video/bg.mp4" type="video/mp4"></video>
    </div>

    <div class="unslate_co--site-wrap">
      <div class="unslate_co--site-inner">

        <nav class="unslate_co--site-nav site-nav-target">
          <div class="container">
            <div class="row align-items-center justify-content-between text-left">
              <div class="col-md-5 text-right">
                <ul class="site-nav-ul js-clone-nav text-left d-none d-lg-inline-block">
                  <li><a href="index.html#home-section" class="nav-link">Home</a></li>
                  <li><a href="index.html#portfolio-section" class="nav-link">Portfolio</a></li>
                </ul>
              </div>
              <div class="site-logo pos-absolute">
                <a href="index.html" class="unslate_co--site-logo" style="background: white; padding: 10px 15px; display: inline-block; border-radius: 5px; box-shadow: 0 4px 10px rgba(0,0,0,0.3);">
                  <img src="images/logo.png" alt="BlackBear Logo" style="height: 40px; width: auto; vertical-align: middle;">
                </a>
              </div>
              <div class="col-md-5 text-right text-lg-left">
                <ul class="site-nav-ul js-clone-nav text-left d-none d-lg-inline-block">
                  <li><a href="index.html#journal-section" class="nav-link">Journal</a></li>
                  <li><a href="index.html#contact-section" class="nav-link">Contact</a></li>
                </ul>
              </div>
            </div>
          </div>
        </nav>

        <div class="container order-section">
            <div id="loading-view" class="text-center"><h2>SINCRONIZANDO CON EL ESTUDIO...</h2></div>

            <div id="order-view" style="display:none;" data-aos="fade-up">
                <div class="row align-items-center">
                    <div class="col-lg-7">
                        <span id="order-category" class="badge-status"></span>
                        <h1 id="order-title" style="font-weight: 900; font-size: 3.5rem; text-transform: uppercase; line-height: 1; margin-bottom: 25px;"></h1>
                        
                        <div class="mb-4">
                            <h5 style="font-size: 10px; text-transform: uppercase; letter-spacing: 2px; opacity: 0.5; font-weight: 800;">Descripción del Proyecto</h5>
                            <p id="order-description" style="font-size: 18px; color: #ccc; line-height: 1.6;"></p>
                        </div>

                        <p id="order-client" style="letter-spacing: 4px; opacity: 0.3; text-transform: uppercase; font-size: 11px; font-weight: 700;"></p>
                    </div>

                    <div class="col-lg-4 offset-lg-1">
                        <div class="info-panel">
                            <div class="mb-4">
                                <span style="font-size: 10px; text-transform: uppercase; letter-spacing: 2px; opacity: 0.4; font-weight: 800;">Estatus Actual</span>
                                <h3 id="order-status-text" style="font-weight: 900; text-transform: uppercase; margin: 5px 0 0 0;"></h3>
                            </div>
                            
                            <div class="mb-4 py-3 border-top border-bottom" style="border-color: #222 !important;">
                                <span style="font-size: 10px; text-transform: uppercase; letter-spacing: 2px; opacity: 0.4; font-weight: 800;">Revisiones</span>
                                <h4 style="font-weight: 900; margin: 10px 0 0 0;">DISPONIBLES: <span id="order-revisions" class="revision-badge">0</span></h4>
                            </div>

                            <div id="actions-area"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <footer class="unslate_co--footer unslate_co--section">
          <div class="container">
            <div class="row justify-content-center">
              <div class="col-md-7 text-center">
                <div class="footer-site-logo">
                  <a href="index.html" style="background: white; padding: 8px 12px; display: inline-block; border-radius: 5px; margin-bottom: 20px;">
                    <img src="images/logo.png" alt="BlackBear Logo" style="height: 35px; width: auto; vertical-align: middle;">
                  </a>
                </div>
                <ul class="footer-site-social">
                  <li><a href="#">Facebook</a></li>
                  <li><a href="#">Instagram</a></li>
                </ul>
                <p class="site-copyright">Copyright &copy; 2026 BlackBear. All rights reserved.</p>
              </div>
            </div>
          </div>
        </footer>

      </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <script>
        const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vR7MfUJrspnPSDFqmPX0oPA_PtDE7312RnzngMrCwpGfgjRSvXD6jmiiDFVhAlbOTwmFmOEixPzBZ_z/pub?output=csv";
        const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxo0txYdwsl7p5YdBn4obClxFRQz3MXfgS1l6bHimyBP_p8FxPiSBvOdC8i7unntojGQQ/exec";

        document.addEventListener('DOMContentLoaded', () => {
            const id = new URLSearchParams(window.location.search).get('id');
            Papa.parse(CSV_URL, {
                download: true, header: true,
                complete: (results) => {
                    const order = results.data.find(row => row.ID === id);
                    if(order) renderOrder(order);
                }
            });
        });

        function renderOrder(order) {
            document.getElementById('loading-view').style.display = 'none';
            document.getElementById('order-view').style.display = 'block';

            // Mapeo basado en imagen
            document.getElementById('order-title').innerText = order.Proyecto;
            document.getElementById('order-description').innerText = order.Descripcion || "Sin descripción adicional.";
            document.getElementById('order-revisions').innerText = order.Revisiones || "0";
            document.getElementById('order-client').innerText = `CLIENTE: ${order.Cliente}`;
            document.getElementById('order-status-text').innerText = order.Estatus.replace(/_/g, ' ');
            
            const cat = document.getElementById('order-category');
            cat.innerText = order.Categoria_Pago;

            const actions = document.getElementById('actions-area');
            if(order.Estatus === 'ESPERANDO_PAGO') {
                actions.innerHTML = `
                    <div class="upload-area" id="upload-box">
                        <p id="upload-label" style="font-size: 11px; font-weight: 700; opacity: 0.5; margin-bottom: 25px; text-transform: uppercase;">Sube tu comprobante (PNG/JPG)</p>
                        <input type="file" id="fileInput" class="d-none" onchange="handleFileSelected('${order.ID}')">
                        <button class="btn-blackbear" id="upload-btn" onclick="document.getElementById('fileInput').click()">ENVIAR PAGO</button>
                    </div>`;
            }
        }

        async function handleFileSelected(orderId) {
            const btn = document.getElementById('upload-btn');
            const file = document.getElementById('fileInput').files[0];
            if(!file) return;

            btn.innerText = "ENVIANDO...";
            btn.disabled = true;

            const reader = new FileReader();
            reader.onload = async (e) => {
                const base64 = e.target.result.split(',')[1];
                const formData = new URLSearchParams();
                formData.append('fileBase64', base64);
                formData.append('mimeType', file.type);
                formData.append('fileName', `Orden_${orderId}_anticipo`);
                formData.append('orderId', orderId);
                formData.append('type', 'anticipo');

                try {
                    await fetch(APPS_SCRIPT_URL, { method: 'POST', mode: 'no-cors', body: formData });
                    document.getElementById('upload-label').style.display = 'none';
                    btn.innerText = "COMPROBANTE ENVIADO";
                    btn.className = "btn-blackbear btn-sent";
                    btn.onclick = null;
                    document.getElementById('upload-box').innerHTML += `<button class="btn-cancel" onclick="location.reload()">CANCELAR ENTREGA</button>`;
                } catch (err) {
                    alert("Error. Intenta de nuevo.");
                    location.reload();
                }
            };
            reader.readAsDataURL(file);
        }
    </script>
</body>
</html>
